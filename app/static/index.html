<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FairFix NT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- Vendored so the app works offline: Tailwind (play build) and Lucide icons. -->
<script src="/static/vendor/tailwind.js"></script>
<script src="/static/vendor/lucide.min.js"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Arial', 'sans-serif'] } } } };
</script>
<style type="text/tailwindcss">
  @layer components {
    .card { @apply min-w-0 rounded-lg border border-slate-200 bg-white shadow-sm; }
    .card-head { @apply flex items-start justify-between gap-3 px-4 pt-4; }
    .card-title { @apply text-sm font-semibold text-slate-900; }
    .card-desc { @apply mt-0.5 text-sm text-slate-500; }
    .card-body { @apply p-4; }
    .btn { @apply inline-flex h-9 shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-md px-3 text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-600/40 disabled:pointer-events-none disabled:opacity-50; }
    .btn-sm { @apply h-8 px-2.5 text-xs; }
    .btn-primary { @apply bg-teal-700 text-white hover:bg-teal-800; }
    .btn-outline { @apply border border-slate-200 bg-white text-slate-900 hover:bg-slate-50; }
    .btn-ghost { @apply text-slate-600 hover:bg-slate-100 hover:text-slate-900; }
    .input { @apply h-9 w-full rounded-md border border-slate-200 bg-white px-3 text-sm text-slate-900 placeholder:text-slate-400 focus-visible:border-teal-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-600/20; }
    textarea.input { @apply h-auto min-h-[84px] py-2; }
    .lbl { @apply mb-1.5 block text-sm font-medium text-slate-700; }
    .badge { @apply inline-flex items-center gap-1 whitespace-nowrap rounded-md border px-2 py-0.5 text-xs font-medium; }
    .b-critical { @apply border-red-200 bg-red-50 text-red-700; }
    .b-high { @apply border-amber-200 bg-amber-50 text-amber-800; }
    .b-medium { @apply border-slate-200 bg-slate-50 text-slate-700; }
    .b-low { @apply border-slate-200 bg-white text-slate-500; }
    .b-review { @apply border-violet-200 bg-violet-50 text-violet-700; }
    .b-accent { @apply border-teal-200 bg-teal-50 text-teal-800; }
    .b-ok { @apply border-emerald-200 bg-emerald-50 text-emerald-700; }
    .b-outline { @apply border-slate-200 bg-white text-slate-600; }
    .tbl { @apply w-full text-left text-sm; }
    .tbl th { @apply h-10 whitespace-nowrap px-3 align-middle text-xs font-medium text-slate-500; }
    .tbl td { @apply border-t border-slate-100 px-3 py-2.5 align-middle; }
    .tbl tr.row-link { @apply cursor-pointer hover:bg-slate-50; }
    .nav-link { @apply flex h-9 items-center gap-2.5 rounded-md px-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900; }
    .nav-link.active { @apply bg-teal-50 text-teal-800; }
    .kv { @apply flex items-center justify-between gap-4 py-2 text-sm; }
    .tip { @apply relative; }
    .tip > .tip-text { @apply pointer-events-none absolute bottom-full left-1/2 z-50 mb-2 hidden w-max max-w-xs -translate-x-1/2 rounded-md bg-slate-900 px-2.5 py-1.5 text-xs font-normal text-white shadow-md; }
    .tip:hover > .tip-text, .tip:focus-within > .tip-text { @apply block; }
  }
</style>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">

<!-- Sign in -->
<section id="loginView" class="hidden min-h-screen place-items-center px-4">
  <div class="card w-full max-w-sm">
    <div class="card-body space-y-5">
      <div class="flex items-center gap-2.5">
        <div class="grid size-8 place-items-center rounded-md bg-teal-700 text-xs font-semibold text-white">FF</div>
        <div><div class="text-sm font-semibold">FairFix NT</div><div class="text-xs text-slate-500">Housing repairs triage</div></div>
      </div>
      <div><h1 class="text-xl font-semibold">Sign in</h1><p class="card-desc">Officers record reports. The admin works the queue and assigns tradies.</p></div>
      <form id="loginForm" class="space-y-3">
        <div><label class="lbl" for="loginUser">Username</label><input id="loginUser" name="username" class="input" autocomplete="username" required></div>
        <div><label class="lbl" for="loginPass">Password</label><input id="loginPass" name="password" type="password" class="input" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-full" type="submit">Sign in</button>
      </form>
      <div class="space-y-2">
        <p class="text-xs text-slate-500">Prototype accounts (not production sign-in)</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" class="demo-fill btn btn-outline h-auto flex-col items-start py-2" data-user="officer" data-pass="Officer1!"><span>Officer</span><span class="text-xs font-normal text-slate-500">officer / Officer1!</span></button>
          <button type="button" class="demo-fill btn btn-outline h-auto flex-col items-start py-2" data-user="admin" data-pass="Admin1!"><span>Admin</span><span class="text-xs font-normal text-slate-500">admin / Admin1!</span></button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- App -->
<div id="appView" class="hidden min-h-screen lg:grid lg:grid-cols-[232px_minmax(0,1fr)]">
  <aside class="sticky top-0 hidden h-screen flex-col border-r border-slate-200 bg-white lg:flex" id="sidebar"></aside>

  <!-- Mobile sheet -->
  <div id="sheet" class="fixed inset-0 z-50 hidden lg:hidden" aria-modal="true" role="dialog">
    <div class="absolute inset-0 bg-slate-900/40" data-close-sheet></div>
    <aside id="sheetPanel" class="absolute inset-y-0 left-0 flex w-64 flex-col border-r border-slate-200 bg-white shadow-lg"></aside>
  </div>

  <div class="min-w-0">
    <header class="sticky top-0 z-40 flex h-14 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur lg:px-6">
      <button id="menuBtn" class="btn btn-ghost size-9 px-0 lg:hidden" aria-label="Open menu"><i data-lucide="menu" class="size-5"></i></button>
      <div id="crumb" class="truncate text-sm text-slate-500"></div>
      <div class="ml-auto flex items-center gap-2">
        <span id="modeBadge" class="tip hidden sm:inline-flex" tabindex="0"></span>
        <div class="relative">
          <button id="userBtn" class="btn btn-ghost gap-2 px-2" aria-haspopup="menu" aria-expanded="false">
            <span id="userInitials" class="grid size-7 place-items-center rounded-full bg-slate-100 text-xs font-semibold text-slate-700"></span>
            <span id="userName" class="hidden text-sm sm:inline"></span><i data-lucide="chevron-down" class="size-4 text-slate-400"></i>
          </button>
          <div id="userMenu" class="absolute right-0 top-full z-50 mt-1 hidden w-56 rounded-md border border-slate-200 bg-white p-1 shadow-md" role="menu">
            <div class="px-2 py-1.5"><div id="menuName" class="text-sm font-medium"></div><div id="menuRole" class="text-xs text-slate-500"></div></div>
            <div class="my-1 h-px bg-slate-100"></div>
            <a href="#/how" class="nav-link h-8 font-normal" role="menuitem"><i data-lucide="circle-help" class="size-4"></i>How it works</a>
            <button id="logoutBtn" class="nav-link h-8 w-full font-normal" role="menuitem"><i data-lucide="log-out" class="size-4"></i>Sign out</button>
          </div>
        </div>
      </div>
    </header>
    <main class="mx-auto w-full max-w-7xl px-4 py-6 lg:px-6">
      <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div><h1 id="pageTitle" class="text-2xl font-semibold tracking-tight sm:text-[28px]"></h1><p id="pageSubtitle" class="mt-1 text-sm text-slate-500"></p></div>
        <div id="pageActions" class="flex flex-wrap gap-2"></div>
      </div>
      <div id="page" aria-live="polite"></div>
    </main>
  </div>
</div>

<div id="toast" class="pointer-events-none fixed bottom-4 right-4 z-[60] translate-y-2 rounded-md bg-slate-900 px-3 py-2 text-sm text-white opacity-0 shadow-lg transition" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
