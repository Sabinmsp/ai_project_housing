name: tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Quoted so YAML keeps it a string; unquoted 3.10 would read as the number 3.1.
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python demo.py
