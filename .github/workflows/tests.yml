name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Quoted so YAML doesn't read it as the number 3.1.
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pytest
