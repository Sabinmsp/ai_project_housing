name: Tests and demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pydantic hypothesis pytest pypdf
      - name: Run the tests
        run: pytest -v
      - name: Run the end-to-end demo
        run: python demo.py

